[package]
name = "scienteer"
version = "0.1.0"
edition = "2021"

[dependencies]
# Avoid building the audio subsystem, which requires external
# system libraries not available in the test environment.
bevy = { version = "0.12", default-features = false, features = [
    "bevy_asset",
    "bevy_winit",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_sprite",
    "bevy_text",
    "png",
    "x11",
] }
bevy_pixel_camera = "0.12"  # For pixel-perfect rendering

# Enable optimizations for dependencies
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
